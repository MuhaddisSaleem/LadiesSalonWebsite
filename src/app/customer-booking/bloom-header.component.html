<header class="bloom-header wrap">
  <a class="wordmark" routerLink="/" aria-label="Bloom Beauty Studio home"><span class="brand-flower" aria-hidden="true">♧</span><span>bloom<small>BEAUTY STUDIO</small></span></a>
  <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="bloom-navigation" aria-label="Toggle navigation"><i class="bi" [class.bi-list]="!menuOpen" [class.bi-x-lg]="menuOpen" aria-hidden="true"></i></button>
  <nav id="bloom-navigation" [class.is-open]="menuOpen" aria-label="Main navigation">
    <a href="#services" (click)="menuOpen = false">Services</a><a href="#bridal" (click)="menuOpen = false">Bridal</a><a href="#bloom-gallery" (click)="menuOpen = false">Gallery</a><a href="#our-story" (click)="menuOpen = false">Our Story</a>
  </nav>
  <button class="bloom-button header-book" type="button" (click)="openBooking()">Book Appointment <span aria-hidden="true">⟶</span></button>
</header>
