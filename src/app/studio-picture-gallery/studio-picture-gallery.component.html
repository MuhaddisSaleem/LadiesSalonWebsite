<section class="studio-gallery-section" aria-labelledby="studio-gallery-title">
  <div class="studio-gallery-shell">
    <div class="studio-gallery-heading">
      <span>THE STUDIO</span>
      <h2 id="studio-gallery-title">Inside HairSense</h2>
      <p>A closer look at the space, details and atmosphere behind the experience.</p>
    </div>

    <div class="studio-picture-gallery">
      <article
        *ngFor="let picture of pictures; trackBy: trackByPicture"
        class="studio-picture"
        [ngClass]="picture.className"
        [attr.aria-label]="picture.alt">
        <div class="studio-picture-photo" [ngStyle]="photoStyle(picture)" aria-hidden="true"></div>
        <div class="studio-picture-overlay" aria-hidden="true"></div>
        <div class="studio-picture-caption">
          <strong>{{ picture.title }}</strong>
        </div>
      </article>
    </div>
  </div>
</section>
