name: ladies-salon

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ladies-salon-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1434:1433"
    volumes:
      - ladies-salon-sql-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: backend/BarberFlow.Api/Dockerfile
    container_name: ladies-salon-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LadiesSalonDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      Cors__AllowedOrigins__0: "http://localhost:4400"
    ports:
      - "5081:8080"

volumes:
  ladies-salon-sql-data:
